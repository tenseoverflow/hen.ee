media:
  input: images
  output: /images
  categories: [image]
content:
  - name: posts
    label: Posts
    path: _posts
    type: collection
    view:
      fields: [ title, summary, date ]
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          rename: safe
        required: true
      - name: description
        label: Description
        type: string
        description: Used for search and social previews.
      - name: summary
        label: Summary
        type: string
      - name: tags
        label: Tags
        type: string
      - name: minute
        label: Reading time in minutes
        type: number
        description: Leave blank to hide reading time.
      - name: image
        label: Image
        type: image
      - name: layout
        type: string
        label: Layout
        default: post
        required: true
        hidden: true
  - name: portfolio
    label: Portfolio cards
    type: file
    path: _data/portfolio.yml
    format: yaml
    fields:
      - name: recent_work
        label: Recent work
        component: portfolio_group
      - name: other_projects
        label: Other projects
        component: portfolio_group
  - name: config
    label: Jekyll config
    path: _config.yml
    type: file
    fields:
      - name: title
        label: Website title
        type: string
      - name: description
        label: Website description
        type: string
        description: Used when a page has no description.
      - name: aboutme
        label: About me
        type: string
      - name: aboutme-text
        label: Homepage introduction
        type: rich-text
        description: Content between the dotted divider and the portfolio section.
        options:
          format: html
      - name: url
        label: Website URL
        type: string
        pattern: ^(https?:\/\/)?(www\.)?[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(\/[^\s]*)?$
      - name: logo
        label: Logo image        
        type: image
        description: Image used in the social preview on social networks (e.g. Facebook, Twitter...)

settings:
  content:
    merge: true

components:
  portfolio_group:
    type: object
    fields:
      - name: items
        label: Cards
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        description: Cards appear in this order. Recent work comes before Other projects.
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: dates
            label: Date or date range
            type: string
          - name: description
            label: Description
            type: text
            required: true
          - name: links
            label: Project links
            type: object
            list:
              collapsible:
                summary: "{label}"
            fields:
              - name: label
                label: Link text
                type: string
                required: true
              - name: url
                label: URL
                type: string
                required: true
