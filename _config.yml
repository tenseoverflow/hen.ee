aboutme-text-est: <p>Tegelen peamiselt veebidisaini ja -arendusega. Vahest ka
  <em>open-source</em> tarkvaraga ning Linuxiga.</p><p>Vahest kirjutan <a
  class="down" href="#recents">blogisse</a> midagi huvitavat. Peamiselt inglise
  keeles, aga kui jõuan, siis ka eesti keeles.</p><p>Jälgi mind <a
  class="outside" href="https://mastodon.social/@henriaunin">Mastodonis</a>, <a
  class="outside" href="https://github.com/tenseoverflow">Githubis</a> või saada
  e-mail <a href="mailto:contact@hen.ee">contact@hen.ee</a> (<a
  href="https://hen.ee/hen.asc">GPG</a>).</p>
